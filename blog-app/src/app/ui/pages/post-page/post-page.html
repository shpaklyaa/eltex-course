<article class="blog-article" id="post">
    <div class="image-container-blog-article">
        <img [src]="article()?.imgSrc || './assets/images/imagenotloaded.png'" class="bg-image" alt="">
    </div>
    <div class="text-container-blog-article">
        <h3 class="article-title">{{article()?.title}}</h3>
        <p class="article-content">{{article()?.content}}</p>
        <div class="article-meta">
        <span>Рейтинг: </span>
            <button (click)="onArticleRatingChange(-1)" [disabled]="article()?.rating === 0" *appHasRole="'admin'">-</button>
            <span>{{ article()?.rating ?? 0 }}⭐</span>
            <button (click)="onArticleRatingChange(1)" *appHasRole="'admin'">+</button>
        </div>
        <time class="article-date">14 oct, 2026</time> 
    </div>
</article>

@if (isLoggedIn()) {
    <app-comments-form
    (save)="saveComment($event)">
    </app-comments-form>
} @else {
    <div class="auth-to-comment-box"><h3 class="auth-to-comment">Нужно авторизоваться, чтобы оставлять комментарии</h3></div>
}

<div class="blogs-grid">
    @for (comment of comments(); track comment?.id) {
        <app-comment
        [comment]="comment"
        (delete)="deleteComment(comment.id, comment.articleId)"
        (edit)="saveComment($event)">
        </app-comment>
    }

    @empty {
        <h4 class="comments-not-found">Нет коментариев</h4>
    }
</div>
