<article class="blog-article" id="post">
    <div class="image-container-blog-article"></div>
    <div class="text-container-blog-article">
        <h3 class="article-title">{{title}}</h3>
        <p class="article-content">{{content}}</p>
        <time class="article-date">14 oct, 2026</time> 
    </div>
    <button class="delete-btn" (click)="onDelete()">
        <img src="assets/images/cross.svg" width="30px" height="30px">
    </button>
</article>
